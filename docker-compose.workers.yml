# Agent workers (parse → brief → schema → components → verification).
# Start with: make workers  (requires OPENROUTER_API_KEY in .env)

x-agent-volumes: &agent-volumes
  - ./workers/src:/app/src
  - ./pandora_shared:/app/pandora_shared

x-agent-restart: &agent-restart
  restart: unless-stopped

services:
  worker-parse-text:
    <<: *agent-restart
    build:
      context: .
      dockerfile: workers/Dockerfile.base
    command: ["python", "-m", "pandora_workers.run.parse_text"]
    env_file: .env
    volumes: *agent-volumes
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net

  worker-parse-image:
    <<: *agent-restart
    build:
      context: .
      dockerfile: workers/Dockerfile.base
    command: ["python", "-m", "pandora_workers.run.parse_image"]
    env_file: .env
    volumes: *agent-volumes
    depends_on:
