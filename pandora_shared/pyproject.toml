[project]
name = "pandora-shared"
version = "0.1.0"
description = "Shared queue names, enums, and message contracts for Pandora"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pandora_shared*"]
