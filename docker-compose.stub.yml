# Stub workers for Phase 3 E2E (Step 7). Use: make dev-stub
services:
  stub-parse-text:
    profiles: ["stub"]
    build:
      context: .
      dockerfile: workers/stub/Dockerfile
    env_file: .env
    command: ["python", "-m", "pandora_stub.parse_worker", "text"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net

  stub-parse-image:
    profiles: ["stub"]
    build:
      context: .
      dockerfile: workers/stub/Dockerfile
    env_file: .env
    command: ["python", "-m", "pandora_stub.parse_worker", "image"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net

  stub-parse-url:
    profiles: ["stub"]
    build:
      context: .
      dockerfile: workers/stub/Dockerfile
    env_file: .env
    command: ["python", "-m", "pandora_stub.parse_worker", "url"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net

  stub-downstream:
    profiles: ["stub"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: workers/stub/Dockerfile
    env_file: .env
    environment:
      # When 1, stub does not bind pandora.brief.request (run worker-brief instead).
      STUB_SKIP_BRIEF: ${STUB_SKIP_BRIEF:-}
      # When 1, stub does not bind pandora.schema.request (run worker-schema instead).
      STUB_SKIP_SCHEMA: ${STUB_SKIP_SCHEMA:-}
      # When 1, stub does not bind pandora.component.generate (run component-gen + feedback).
      STUB_SKIP_COMPONENT: ${STUB_SKIP_COMPONENT:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net
