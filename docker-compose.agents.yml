# Real agents (Phases 4–7).
# Phase 4 parse only: make dev-parse-agents
# Phase 6 E2E: make dev-phase6-e2e (default --scale 5 for worker-component-gen + worker-feedback)
# Entry modules live under workers/src/pandora_workers/run/

x-agent-volumes: &agent-volumes
  - ./workers/src:/app/src
  - ./pandora_shared:/app/pandora_shared

x-agent-restart: &agent-restart
  restart: unless-stopped

services:
  worker-parse-text:
    <<: *agent-restart
    profiles: ["agents", "agents-parse"]
    build:
      context: .
      dockerfile: workers/Dockerfile.base
    command: ["python", "-m", "pandora_workers.run.parse_text"]
    env_file: .env
    volumes: *agent-volumes
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net

  worker-parse-image:
    <<: *agent-restart
    profiles: ["agents", "agents-parse"]
    build:
      context: .
      dockerfile: workers/Dockerfile.base
    command: ["python", "-m", "pandora_workers.run.parse_image"]
    env_file: .env
    volumes: *agent-volumes
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net

  worker-parse-url:
    <<: *agent-restart
    profiles: ["agents", "agents-parse"]
    build:
      context: .
      dockerfile: workers/Dockerfile.crawl
    command: ["python", "-m", "pandora_workers.run.parse_url"]
    env_file: .env
    shm_size: "2gb"
    volumes: *agent-volumes
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net

  worker-brief:
    <<: *agent-restart
    profiles: ["agents-downstream"]
    build:
      context: .
      dockerfile: workers/Dockerfile.base
    command: ["python", "-m", "pandora_workers.run.brief"]
    env_file: .env
    volumes: *agent-volumes
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net

  worker-schema:
    profiles: ["agents-downstream"]
    build:
      context: .
      dockerfile: workers/Dockerfile.base
    command: ["python", "-m", "pandora_workers.run.schema"]
    env_file: .env
    volumes: *agent-volumes
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net

  worker-component-gen:
    <<: *agent-restart
    profiles: ["agents-downstream"]
    build:
      context: .
      dockerfile: workers/Dockerfile.base
    command: ["python", "-m", "pandora_workers.run.component_gen"]
    env_file: .env
    volumes: *agent-volumes
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net

  worker-feedback:
    <<: *agent-restart
    profiles: ["agents-downstream"]
    build:
      context: .
      dockerfile: workers/Dockerfile.base
    command: ["python", "-m", "pandora_workers.run.feedback"]
    env_file: .env
    volumes: *agent-volumes
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net

  worker-verification:
    profiles: ["agents-downstream"]
    build:
      context: .
      dockerfile: workers/Dockerfile.base
    command: ["python", "-m", "pandora_workers.run.verification"]
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net

  worker-showcase:
    profiles: ["agents-downstream"]
    build:
      context: .
      dockerfile: workers/Dockerfile.base
    command: ["python", "-m", "pandora_workers.run.showcase"]
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net
