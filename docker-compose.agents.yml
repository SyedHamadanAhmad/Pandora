# Real agents (Phases 4–7). Use: make dev-agents
# Entry modules live under workers/src/pandora_workers/run/
services:
  worker-parse-text:
    profiles: ["agents"]
    build:
      context: .
      dockerfile: workers/Dockerfile.base
    command: ["python", "-m", "pandora_workers.run.parse_text"]
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pandora-net

  worker-parse-image:
    profiles: ["agents"]
